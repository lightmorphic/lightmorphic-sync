# Reverse-proxies the three Chrome Web Store endpoints the browser's
# --apps-gallery-* launcher flags point at, so a user's IP never talks to
# Google directly for extension browsing/install/update. This proxy's own
# IP is visible to Google — that's the honest tradeoff, documented in the
# README, not hidden.

worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 8.8.8.8 ipv6=off;

  server {
    listen 8080;

    location /webstore/ {
      proxy_pass https://chrome.google.com/webstore/;
      proxy_set_header Host chrome.google.com;
      proxy_ssl_server_name on;
    }

    location /service/update2/crx {
      proxy_pass https://clients2.google.com/service/update2/crx;
      proxy_set_header Host clients2.google.com;
      proxy_ssl_server_name on;
    }

    location /crx/ {
      proxy_pass https://clients2.googleusercontent.com/crx/;
      proxy_set_header Host clients2.googleusercontent.com;
      proxy_ssl_server_name on;
    }

    location /healthz {
      return 200 "ok\n";
    }
  }
}
